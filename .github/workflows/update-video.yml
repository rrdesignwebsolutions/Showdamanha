name: Update latest video

on:
  schedule:
    # Executa a cada 30 minutos
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Fetch latest video
        run: pnpm run fetch:video

      - name: Commit updated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/latest-video.json

          if git diff --cached --quiet; then
            echo "No video updates to commit"
          else
            git commit -m "chore: update latest video"
            git push origin HEAD:main
          fi